<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>RTW</title>
<script>try{var l=localStorage.getItem("rtw-lang");if(l!=="ar"&&l!=="en")l=(navigator.language||"").toLowerCase().indexOf("en")===0?"en":"ar";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";var m=localStorage.getItem("rtw-theme");if(m)document.documentElement.dataset.theme=m}catch(e){}</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">

</head>
<body>
<script type="module">
import { mountShell } from "/assets/shell.js";
import { mountBrowser, fileUrl } from "/assets/browse.js";
import { t } from "/assets/i18n.js";
const base = "/data/books";
mountBrowser(mountShell({ active: "books" }), {
  base, rootLabel: t.nav.books, emptyText: t.emptyBooks,
  // PDFs/EPUBs open in the browser instead of forcing a download.
  fileLink: (path, name) => fileUrl(base, path, name),
});
</script>
</body>
</html>
