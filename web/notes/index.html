<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>RTW</title>
<script>try{var l=localStorage.getItem("rtw-lang");if(l!=="ar"&&l!=="en")l=(navigator.language||"").toLowerCase().indexOf("en")===0?"en":"ar";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";var m=localStorage.getItem("rtw-theme");if(m)document.documentElement.dataset.theme=m}catch(e){}</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">

</head>
<body>
<script type="module">
import { mountShell, el } from "/assets/shell.js";
import { mountBrowser, fileUrl } from "/assets/browse.js";
import { renderMarkdown } from "/assets/md.js";
import { t } from "/assets/i18n.js";
import { icon } from "/assets/icons.js";
const base = "/data/notes";
const f = new URLSearchParams(location.search).get("f");
if (f) {
  // Viewer: ?f=/folder/file.md
  const name = f.split("/").pop();
  const main = mountShell({ active: "notes", title: name });
  const dir = f.slice(0, f.lastIndexOf("/") + 1);
  const back = el("a", { class: "btn small", href: "./#" + encodeURIComponent(dir), html: `${icon("back")}<span>${t.back}</span>` });
  const doc = el("article", { class: "doc", dir: "auto" });
  main.append(el("div", { class: "toolbar" }, back), doc);
  const text = await fetch(fileUrl(base, "", f), { cache: "no-store" }).then((r) => r.text());
  if (/\.(md|markdown)$/i.test(f)) doc.innerHTML = renderMarkdown(text);
  else { doc.classList.add("plain"); doc.textContent = text; }
} else {
  mountBrowser(mountShell({ active: "notes" }), {
    base, rootLabel: t.nav.notes, emptyText: t.emptyNotes, accept: /\.(md|txt|markdown)$/i,
    // Search every note (names and text) on the server, Arabic-aware.
    search: async (q) => (await fetch("/api/notes-search?q=" + encodeURIComponent(q))).json(),
    searchPlaceholder: t.searchNotes,
    fileLink: (path, name) => "?f=" + encodeURIComponent(path + name),
  });
}
</script>
</body>
</html>
