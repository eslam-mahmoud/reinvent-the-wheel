<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>RTW</title>
<script>try{var l=localStorage.getItem("rtw-lang");if(l!=="ar"&&l!=="en")l=(navigator.language||"").toLowerCase().indexOf("en")===0?"en":"ar";document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";var m=localStorage.getItem("rtw-theme");if(m)document.documentElement.dataset.theme=m}catch(e){}</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">

</head>
<body>
<script type="module">
import { mountShell, el } from "/assets/shell.js";
import { listDir } from "/assets/browse.js";
import { t } from "/assets/i18n.js";
import { icon } from "/assets/icons.js";
// Each folder in RTW/www is a site, served at /sites/<folder>/.
const main = mountShell({ active: "sites" });
listDir("/data/www", "/").then((items) => {
  const sites = items.filter((i) => i.type === "directory" && !i.name.startsWith("."));
  if (!sites.length) { main.append(el("p", { class: "empty" }, t.emptySites)); return; }
  const tiles = el("div", { class: "tiles" });
  for (const s of sites) tiles.append(el("a", { class: "tile", href: `/sites/${encodeURIComponent(s.name)}/` },
    el("span", { class: "ticon", html: icon("sites") }), el("h3", { dir: "auto" }, s.name)));
  main.append(tiles);
}).catch((e) => main.append(el("p", { class: "empty" }, "⚠️ " + e.message)));
</script>
</body>
</html>
