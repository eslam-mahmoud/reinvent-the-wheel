name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 56326840a0015adf2c379f7c7d459d87
  NODE_OPTIONS: --no-deprecation

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check-links

      # No API token needed: only validates the Worker config and bundle.
      - name: Check Cloudflare config
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare deployment blocked::GitHub Actions secret CLOUDFLARE_API_TOKEN is missing. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          npx wrangler deploy

      - name: Verify the published Arabic book
        if: github.event_name != 'pull_request'
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 https://reinvent-the-wheel.com/book/ -o /tmp/rtw-book.html; then
              if grep -q 'الحضارة بلا إنترنت' /tmp/rtw-book.html; then
                echo "Published book verified at https://reinvent-the-wheel.com/book/"
                exit 0
              fi
            fi
            echo "Book not yet available (attempt $attempt); retrying..."
            sleep 5
          done
          echo "::error title=Public book verification failed::The website did not serve the new book at https://reinvent-the-wheel.com/book/"
          exit 1
